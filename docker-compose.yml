services:
  database:
    image: mongo:latest
    container_name: food-delivery-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./BackEnd
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/food-delivery
    depends_on:
      - database

  frontend:
    build: ./FrontEnd
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data: